<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer</title>
</head>
<body>
  <h2>Countdown Timer</h2>
  <input type="number" id="timeInput" placeholder="Enter time in seconds">
  <button onclick="startTimer()">Start</button>

  <h1 id="display">00:00:00</h1>

  <script>
    function startTimer() {
      let myTime = parseInt(document.getElementById("timeInput").value);
      let display = document.getElementById("display");

      let timer = setInterval(() => {
        if (myTime <= 0) {
          clearInterval(timer);
          display.textContent = "Time is up!";
          return;
        }

        let hours = Math.floor(myTime / 3600);
        let minutes = Math.floor((myTime % 3600) / 60);
        let seconds = myTime % 60;

        display.textContent = 
          `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

        myTime--;
      }, 1000);
    }
  </script>
</body>
</html>
